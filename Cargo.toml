[workspace]
resolver = "2"
members = ["crates/weblog-engine", "crates/weblog-cli", "crates/weblog-service", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 엔진: 스트리밍 gzip, 정규식, 직렬화, 오류 타입, 시간 파싱, DuckDB 저장소
duckdb = { version = "1.10505.0", features = ["bundled"] }
flate2 = "1.1"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# 파일 식별(선두·전체 해시). 정의 해시는 FNV로 충분하지만 파일 동일성 검증은 충돌 저항이 필요하다.
sha2 = "0.11"
# 포맷 정의 YAML 왕복. serde_yaml은 폐기되어 같은 API를 유지하는 serde_norway를 쓴다.
serde_norway = "0.9"
# Tauri 앱
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-dialog = "2.7"
# CLI 전용
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
# 테스트 전용
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = 1
