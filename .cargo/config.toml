# Windows 배포본은 MSVC 런타임을 정적으로 링크한다. DuckDB(C++)가 동적 MSVCP140.dll을 쓰면
# 사용자 PC의 재배포 패키지가 빌드 툴셋보다 낮을 때 접근 위반으로 죽는다(0.1.3 크래시 리포트:
# 오류 모듈 MSVCP140.dll 14.34, 예외 c0000005). 정적 링크하면 재배포 패키지 자체가 필요 없다.
# cc 크레이트는 이 플래그를 보고 C/C++ 쪽도 /MT로 컴파일한다.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
